dataset:
  type: image_sequence
  input_path: data/ua_detrac/DETRAC-Images/DETRAC-Images/MVI_40204
  camera_id: MVI_40204
  fps_override: 25
  frame_limit: 120
  start_frame: 0
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp

annotations:
  enabled: true
  type: ua_detrac_xml
  input_path: data/ua_detrac/DETRAC-Train-Annotations-XML/DETRAC-Train-Annotations-XML/MVI_40204.xml
  quality:
    completeness: exhaustive
    expected_exhaustive: true
    unreliable_metrics: []
    notes:
      - UA-DETRAC MVI_40204 is a vehicle-only traffic sequence used for primary real-world ROI proposal validation.
      - UA-DETRAC classes are mapped to COCO-compatible YOLOv8 names where possible: car->car, bus->bus, van->car, others->truck.

validation:
  target_classes:
    - car
    - bus
    - truck
  target_policy:
    mode: target_aware_roi
    notes:
      - ROI quality is evaluated against vehicle GT classes for this traffic CCTV sample.
      - Non-vehicle motion is only a cost signal unless it affects vehicle recall or ROI budget.
