dataset:
  type: video
  input_path: data/physicalai_smartspaces/row_0709/MTMC_Tracking_2026/train/Warehouse_000/videos/Camera_0002.mp4
  camera_id: Camera_0002
  fps_override: null
  frame_limit: 120
  start_frame: 5400

annotations:
  enabled: true
  type: physicalai_smartspaces_json
  input_path: data/physicalai_smartspaces/row_0709/MTMC_Tracking_2026/train/Warehouse_000/ground_truth.json
  camera_id: Camera_0002
  bbox_format: xyxy
  quality:
    completeness: synthetic_exhaustive
    expected_exhaustive: true
    unreliable_metrics: []
    notes:
      - PhysicalAI Smart Spaces is synthetic multi-camera scene-level GT.
      - This config starts at frame 5400, which is 3:00 in the 30fps row 709 video.
      - The loader filters ground_truth.json to Camera_0002.

validation:
  target_classes:
    - person
  target_policy:
    mode: target_aware_roi
    notes:
      - ROI quality is evaluated against crowded person GT after the 3-minute mark.
      - Non-target motion is only a cost signal unless it affects target recall or ROI budget.
